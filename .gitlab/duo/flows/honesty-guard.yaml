# Flow Registry Framework v1 Specification: SponsorFit Honesty Guard
#
# Official Specification References:
# - Schema & Framework Guide: https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/blob/main/docs/flow_registry/v1.md
# - Flow Config JSON Schema: https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/blob/main/duo_workflow_service/schemas/v1/flow_config.schema.json
# - Custom Flows User Docs: https://docs.gitlab.com/user/duo_agent_platform/flows/custom/
# - Triggers User Docs: https://docs.gitlab.com/user/duo_agent_platform/triggers/
#
# Environment Justification:
# Environment is set to `ambient`. Per v1.md (lines 54-55) and component.py (line 127),
# `ambient` is designed for background automated execution triggered by GitLab platform events
# (e.g. Merge Request events), where the agent runs asynchronously in the background and cleanly
# interrupts execution to wait for user interaction via HumanInputComponent
# (`supported_environments: ("ambient", "chat", "chat-partial")`).
# `chat-partial` is disallowed because it strictly permits only a single AgentComponent (v1.md line 1779).
# Note: Triggers are NOT defined in YAML; they are configured in the GitLab UI under AI > Triggers.

version: "v1"
environment: ambient
name: "sponsorfit-honesty-guard"
description: "Supervised GitLab Duo flow auditing numeric claims, enforcing mathematical provenance, and gating MR merges for SponsorFit."
product_group: "code_review"

flow:
  entry_point: "honesty_auditor"

components:
  # Step 1: Audit Step
  # Runs the pure Node honesty audit suite via run_command, inspects the MR diff via get_merge_request,
  # and reads generated report via read_file.
  - name: "honesty_auditor"
    type: "AgentComponent"
    prompt_id: "audit_claims_prompt"
    inputs:
      - "context:goal"
    toolset:
      - "run_command"
      - "read_file"
      - "get_merge_request"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"
    ui_role_as: "agent"

  # Step 2: Classification Step
  # AI Task agent that parses raw audit evidence and classifies findings into auto-fixable,
  # needs-human, and blocking using a strict JSON response schema.
  - name: "claim_classifier"
    type: "AgentComponent"
    prompt_id: "classify_claims_prompt"
    response_schema_id: "claim_classification_schema"
    inputs:
      - from: "context:honesty_auditor.final_answer"
        as: "audit_evidence"
    toolset: []
    ui_log_events:
      - "on_agent_final_answer"
    ui_role_as: "agent"

  # Step 3: Human Input / Approval Component
  # Pauses workflow execution, transitions to INPUT_REQUIRED status, and displays the audit
  # breakdown to the human maintainer waiting for approval or rejection.
  - name: "maintainer_approval"
    type: "HumanInputComponent"
    sends_response_to: "fix_remediator"
    interaction_type: "approval"
    message_template: "Honesty Guard Audit Findings:\n{{ summary }}\n\nDetailed Breakdown:\n{{ findings }}\n\nProposed Remediations:\n{{ proposed_fixes }}\n\nPlease review and approve applying the proposed fixes to this Merge Request."
    inputs:
      - from: "context:claim_classifier.final_answer.summary"
        as: "summary"
      - from: "context:claim_classifier.final_answer.findings_table"
        as: "findings"
      - from: "context:claim_classifier.final_answer.proposed_fixes"
        as: "proposed_fixes"
    ui_log_events:
      - "on_user_input_prompt"
      - "on_user_response"

  # Step 4: Fix / Remediation Step
  # Upon explicit human maintainer approval, applies verified derivation tags to the branch
  # via edit_file and posts a summary comment via create_merge_request_note.
  - name: "fix_remediator"
    type: "AgentComponent"
    prompt_id: "apply_fixes_prompt"
    inputs:
      - from: "context:maintainer_approval.approval"
        as: "approval_decision"
      - from: "context:claim_classifier.final_answer.proposed_fixes"
        as: "approved_fixes"
      - from: "context:claim_classifier.final_answer.findings_table"
        as: "findings_table"
    toolset:
      - "edit_file"
      - "create_merge_request_note"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"
    ui_role_as: "agent"

routers:
  - from: "honesty_auditor"
    to: "claim_classifier"
  - from: "claim_classifier"
    to: "maintainer_approval"
  - from: "maintainer_approval"
    condition:
      input: "context:maintainer_approval.approval"
      routes:
        "approve": "fix_remediator"
        "reject": "abort"
        "default_route": "abort"
  - from: "fix_remediator"
    to: "end"

response_schemas:
  - schema_id: "claim_classification_schema"
    definition:
      $schema: "http://json-schema.org/draft-07/schema#"
      title: "claim_classification_response"
      type: "object"
      properties:
        overall_status:
          type: "string"
          enum: ["passed", "blocked", "needs_review"]
        summary:
          type: "string"
          description: "Summary of numeric claims evaluated"
        blocking_count:
          type: "integer"
          minimum: 0
        auto_fixable_count:
          type: "integer"
          minimum: 0
        needs_human_count:
          type: "integer"
          minimum: 0
        findings_table:
          type: "string"
          description: "Markdown table of categorized findings"
        proposed_fixes:
          type: "string"
          description: "Exact text replacements and derivation tags to apply"
      required:
        - "overall_status"
        - "summary"
        - "blocking_count"
        - "auto_fixable_count"
        - "findings_table"
        - "proposed_fixes"

prompts:
  - prompt_id: "audit_claims_prompt"
    name: "Claim Audit Prompt"
    unit_primitives:
      - "duo_agent_platform"
    prompt_template:
      system: |
        You are the SponsorFit Honesty Guard Auditor.
        Your job is to inspect git diffs, run the mathematical provenance test suite via run_command,
        read the generated honesty-report.json via read_file, and return full findings.
      user: |
        Execute honesty audit for merge request: {{goal}}
    params:
      timeout: 180

  - prompt_id: "classify_claims_prompt"
    name: "Claim Classification Prompt"
    unit_primitives:
      - "duo_agent_platform"
    prompt_template:
      system: |
        You are the SponsorFit Claim Classifier.
        Analyze the raw audit findings provided in the input. Sort all detected numeric claims into:
        - auto-fixable: Missing standard citation tags ([derived: affinity / mean(sample)]).
        - needs-human: Contextual metrics requiring maintainer confirmation.
        - blocking: Unbacked marketing percentages (e.g. '500% more engagement') or ungrounded claims.
        Structure your answer according to the claim_classification_schema response schema.
      user: |
        Here are the audit findings to classify:
        {{audit_evidence}}
    params:
      timeout: 180

  - prompt_id: "apply_fixes_prompt"
    name: "Apply Approved Fixes Prompt"
    unit_primitives:
      - "duo_agent_platform"
    prompt_template:
      system: |
        You are the SponsorFit Supervised Remediator.
        Check the maintainer approval decision. If approved, apply the approved fixes using edit_file
        and leave a summary comment on the Merge Request using create_merge_request_note.
        If not approved, take no mutating actions.
      user: |
        Approval decision: {{approval_decision}}
        Approved fixes: {{approved_fixes}}
        Findings table: {{findings_table}}
    params:
      timeout: 180
